    <!--
      Motion guard. Reveal styles hide their elements before GSAP runs, so they
      are only armed once we know scripting is available and the reader has not
      asked for reduced motion. If either is false the page renders fully
      visible with no animation at all.
    -->
    <script>
      (function () {
        try {
          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            document.documentElement.classList.add("motion");
          }
        } catch (e) {}
      })();
    </script>
